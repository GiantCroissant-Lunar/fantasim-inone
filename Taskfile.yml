version: '3'

vars:
  GODOT_PATH: C:/lunar-horse/tools/Godot_v4.6-stable_mono_win64/Godot_v4.6-stable_mono_win64_console.exe
  PROJECT_PATH: project/hosts/complete-app
  SLN_PATH: fantasim-inone.sln
  GITVERSION_CMD: 'dotnet-gitversion /output json 2>nul | python -c "import sys,json;print(json.load(sys.stdin)[''MajorMinorPatch''])"'
  UNIFY: dotnet tool run unify-build --

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  setup:
    desc: Restore dotnet tools (unify-build, gitversion)
    cmds:
      - dotnet tool restore

  build:
    desc: Build the entire solution via unify-build
    deps: [setup]
    cmds:
      - '{{.UNIFY}} Compile --configuration Debug'

  pack:
    desc: Pack contracts as NuGet packages
    deps: [setup]
    vars:
      CONFIGURATION: '{{default "Release" .CONFIGURATION}}'
    cmds:
      - '{{.UNIFY}} PackProjects --configuration {{.CONFIGURATION}}'
    env:
      GITVERSION_MAJORMINORPATCH:
        sh: '{{.GITVERSION_CMD}}'

  publish:
    desc: Publish plugins and bundles
    deps: [setup]
    vars:
      CONFIGURATION: '{{default "Release" .CONFIGURATION}}'
    cmds:
      - '{{.UNIFY}} PublishProjects --configuration {{.CONFIGURATION}}'
    env:
      GITVERSION_MAJORMINORPATCH:
        sh: '{{.GITVERSION_CMD}}'

  test:
    desc: Run all xunit tests
    cmds:
      - dotnet test {{.SLN_PATH}}

  verify:
    desc: Run Godot headless to verify bootstrap
    cmds:
      - '"{{.GODOT_PATH}}" --path {{.PROJECT_PATH}} --headless --quit-after 3000'

  clean:
    desc: Clean build artifacts
    cmds:
      - dotnet clean {{.SLN_PATH}}
      - rm -rf .bundle-temp/
      - rm -rf build/_artifacts/
    ignore_error: true

  format:
    desc: Format GDScript and C# code
    cmds:
      - gdformat --verbose project/ || echo "gdformat not found"
      - dotnet format {{.SLN_PATH}}

  format:check:
    desc: Check if code is properly formatted
    cmds:
      - gdformat --check-only --verbose project/ || echo "gdformat not found"
      - dotnet format {{.SLN_PATH}} --verify-no-changes --verbosity minimal

  gate:
    desc: Full gate check — build + test + format
    cmds:
      - task build
      - task test
      - task format:check

  run:
    desc: Run the Godot project
    cmds:
      - '"{{.GODOT_PATH}}" --path {{.PROJECT_PATH}}'

  run:headless:
    desc: Run the project in headless mode
    cmds:
      - '"{{.GODOT_PATH}}" --path {{.PROJECT_PATH}} --headless'

  export:
    desc: Export debug build for Windows to build/_artifacts/{version}
    deps: [build]
    vars:
      VERSION:
        sh: '{{.GITVERSION_CMD}}'
    cmds:
      - mkdir -p build/_artifacts/{{.VERSION}}
      - '"{{.GODOT_PATH}}" --path {{.PROJECT_PATH}} --headless --export-debug "Windows Desktop" ../../../build/_artifacts/{{.VERSION}}/complete-app.exe'

  export:run:
    desc: Export and run the app with 8s timeout for smoke testing
    deps: [export]
    vars:
      VERSION:
        sh: '{{.GITVERSION_CMD}}'
    cmds:
      - 'timeout 8 "build/_artifacts/{{.VERSION}}/complete-app.exe" -- --verbose || true'

  version:
    desc: Show computed version via GitVersion
    deps: [setup]
    cmds:
      - 'dotnet-gitversion /output json 2>nul | python -c "import sys,json;d=json.load(sys.stdin);print(d[''FullSemVer''])"'

  pre-commit:install:
    desc: Install pre-commit hooks
    cmds:
      - pre-commit install

  pre-commit:run:
    desc: Run all pre-commit hooks
    cmds:
      - pre-commit run --all-files
